<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Llmzempic</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='11' width='26' height='10' rx='5' transform='rotate(-45 16 16)' fill='%230e7e81'/%3E%3Cpath d='M12.5 12.5l7 7' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
	<script>
		// Resolve the theme before first paint so dark mode never flashes light.
		(() => {
			let theme = "system";
			try { theme = localStorage.getItem("llmz-theme") || "system"; } catch { }
			const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
			document.documentElement.dataset.theme = dark ? "dark" : "light";
		})();
	</script>
	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/base.css">
	<link rel="stylesheet" href="css/components.css">
	<link rel="stylesheet" href="css/content.css">
	<link rel="stylesheet" href="css/overlays.css">
	<link rel="stylesheet" href="css/shell.css">
	<link rel="stylesheet" href="css/task.css">
	<link rel="stylesheet" href="css/examples.css">
	<link rel="stylesheet" href="css/model.css">
	<link rel="stylesheet" href="css/train.css">
</head>
<body>
	<header class="mobile-bar">
		<button id="drawer-btn" class="btn btn-ghost btn-icon" type="button" aria-label="Show projects">
			<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
		</button>
		<span class="brand-name">Llmzempic</span>
	</header>

	<div class="app">
		<aside class="sidebar" aria-label="Projects">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 32 32"><rect x="3" y="11" width="26" height="10" rx="5" transform="rotate(-45 16 16)"/><path d="M12.5 12.5l7 7"/></svg>
				</span>
				<span>
					<span class="brand-name">Llmzempic</span>
					<span class="brand-sub">Fine-tune small models for JSON</span>
				</span>
			</div>
			<div class="side-head">
				<span>Projects</span>
				<button id="new-project-btn" class="btn btn-ghost btn-icon btn-sm" type="button" title="New project" aria-label="New project">
					<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
				</button>
			</div>
			<nav id="project-list" class="project-list"></nav>
			<div class="side-foot">
				<div id="job-slot"></div>
				<div id="hw-slot"></div>
				<div class="spread">
					<button id="settings-btn" class="btn btn-ghost btn-sm" type="button">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg>
						Settings
					</button>
					<div id="theme-slot"></div>
				</div>
			</div>
		</aside>
		<div class="scrim" id="scrim"></div>

		<main class="main">
			<section id="welcome" class="welcome" hidden></section>

			<section id="project" hidden>
				<header class="page-head">
					<div class="title-row">
						<h1 id="project-title" class="ellipsis"></h1>
						<span id="kind-slot"></span>
						<span id="save-state" class="faint small" aria-live="polite"></span>
						<span class="grow"></span>
						<div id="project-menu"></div>
					</div>
					<nav id="stepper" class="stepper" aria-label="Steps"></nav>
				</header>
				<div class="page-body">
					<div id="tab-task" class="tab-pane" hidden></div>
					<div id="tab-examples" class="tab-pane" hidden></div>
					<div id="tab-model" class="tab-pane" hidden></div>
					<div id="tab-train" class="tab-pane" hidden></div>
					<div id="tab-export" class="tab-pane" hidden></div>
				</div>
			</section>
		</main>
	</div>

	<script type="module" src="js/main.js"></script>
</body>
</html>
